<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 400" role="img" aria-label="Payments flowing from checkouts through the AQ Pay core to providers; a declined payment is rerouted to a backup acquirer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .lbl{fill:#F4F7FC;font-size:14px;font-weight:600}
    .pill{fill:#0F1729;stroke:rgba(255,255,255,.14);stroke-width:1.5}
    .wire{fill:none;stroke:rgba(110,155,255,.3);stroke-width:2}
    .wire-out{fill:none;stroke:rgba(61,220,151,.28);stroke-width:2}
    .wire-bad{fill:none;stroke:rgba(255,122,133,.32);stroke-width:2;stroke-dasharray:5 6}
    @media (prefers-reduced-motion: reduce){animateMotion,animate{display:none}}
  </style>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16213A"/><stop offset="1" stop-color="#060A14"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E9BFF"/><stop offset=".55" stop-color="#6E9BFF"/><stop offset="1" stop-color="#3DDC97"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#6E9BFF" stop-opacity=".32"/><stop offset="1" stop-color="#6E9BFF" stop-opacity="0"/></radialGradient>
    <path id="i1" d="M92 62 C 92 100, 180 95, 180 135"/>
    <path id="i2" d="M268 62 C 268 100, 180 95, 180 135"/>
    <path id="o1" d="M180 255 C 180 295, 62 290, 62 330"/>
    <path id="o2" d="M180 255 L 180 330"/>
    <path id="o3" d="M180 255 C 180 295, 298 290, 298 330"/>
  </defs>
  <circle cx="180" cy="195" r="120" fill="url(#glow)"/>
  <use href="#i1" xlink:href="#i1" class="wire"/><use href="#i2" xlink:href="#i2" class="wire"/>
  <use href="#o1" xlink:href="#o1" class="wire-out"/><use href="#o2" xlink:href="#o2" class="wire-bad"/><use href="#o3" xlink:href="#o3" class="wire-out"/>
  <rect class="pill" x="16" y="18" width="152" height="44" rx="14"/><circle cx="38" cy="40" r="4.5" fill="#6E9BFF"/><text class="lbl" x="52" y="45">Checkout</text>
  <rect class="pill" x="192" y="18" width="152" height="44" rx="14"/><circle cx="214" cy="40" r="4.5" fill="#6E9BFF"/><text class="lbl" x="228" y="45">Platform API</text>
  <circle cx="180" cy="195" r="64" fill="none" stroke="#6E9BFF" stroke-width="1.5" opacity="0"><animate attributeName="r" values="62;88" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="120" y="135" width="120" height="120" rx="30" fill="url(#core)" stroke="rgba(110,155,255,.55)" stroke-width="2"/>
  <g transform="translate(150 148) scale(.95)">
    <circle cx="31" cy="30" r="17" fill="none" stroke="url(#ring)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M24.5 38.5 L31 21.5 L37.5 38.5" fill="none" stroke="#F1F5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27.4 33 H34.6" stroke="#F1F5FF" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M39.4 37.2 Q46.6 44.4 55.4 44.6 A1.55 1.55 0 0 1 55.3 47.7 Q44.9 48.3 37.2 40.2 Z" fill="#3DDC97"/>
  </g>
  <text x="180" y="232" text-anchor="middle" class="lbl" font-size="13">AQ Pay core</text>
  <rect class="pill" x="8" y="330" width="108" height="44" rx="14"/><text class="lbl" x="26" y="357">PSP A</text><path d="M88 352 l4 4 l8 -9" fill="none" stroke="#3DDC97" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="pill" x="126" y="330" width="108" height="44" rx="14"/><text class="lbl" x="144" y="357">PSP B</text>
  <g opacity="0"><circle cx="208" cy="352" r="10" fill="rgba(255,122,133,.16)"/><path d="M203.5 347.5 l9 9 M212.5 347.5 l-9 9" stroke="#FF7A85" stroke-width="2.6" stroke-linecap="round"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.27;.5;.56;1" dur="4.8s" repeatCount="indefinite"/></g>
  <rect class="pill" x="244" y="330" width="108" height="44" rx="14"/><text class="lbl" x="258" y="357">Acquirer</text><path d="M326 352 l4 4 l8 -9" fill="none" stroke="#3DDC97" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="298" y="392" text-anchor="middle" fill="#E6C27A" font-size="11" font-weight="700" letter-spacing=".1em" opacity="0">REROUTED<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.42;.48;.78;.84;1" dur="4.8s" repeatCount="indefinite"/></text>
  <circle r="5" fill="#6E9BFF"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"><mpath href="#i1" xlink:href="#i1"/></animateMotion></circle>
  <circle r="5" fill="#6E9BFF"><animateMotion dur="1.8s" repeatCount="indefinite" begin=".9s"><mpath href="#i2" xlink:href="#i2"/></animateMotion></circle>
  <circle r="5" fill="#3DDC97"><animateMotion dur="2.2s" repeatCount="indefinite" begin=".4s"><mpath href="#o1" xlink:href="#o1"/></animateMotion></circle>
  <circle r="5.5" fill="#E6C27A" opacity="0"><animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;.9;.9" keyTimes="0;.25;1"><mpath href="#o2" xlink:href="#o2"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.25;.27;1" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle r="5.5" fill="#E6C27A" opacity="0"><animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.28;.46;1"><mpath href="#o3" xlink:href="#o3"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.27;.28;.46;.48;1" dur="4.8s" repeatCount="indefinite"/></circle>
</svg>
