<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, sans-serif"><rect width="1200" height="630" fill="#0F1729"/><image href="/aq-pay-logo.svg" x="54" y="38" width="208" height="48"/><text x="60" y="170" fill="#6E9BFF" font-size="20" letter-spacing="3">US MERCHANT ACCOUNTS</text><g fill="#F4F7FC" font-size="66" font-weight="700"><text x="56" y="266">Review the exit.</text><text x="56" y="348">Before you sign.</text></g><text x="60" y="419" fill="#AEB9CC" font-size="25">The final sale is only one date.</text><text x="60" y="552" fill="#AEB9CC" font-size="18" letter-spacing="2">CONTRACTS / RECORDS / RESERVES</text><g transform="translate(690 140)"><rect width="440" height="390" rx="23" fill="#0F1729" stroke="#6E9BFF" stroke-width="3"/><path d="M0 72H440" stroke="#6E9BFF" stroke-width="2"/><path d="M85 -15V22M355 -15V22" stroke="#F4F7FC" stroke-width="9" stroke-linecap="round"/><text x="28" y="47" fill="#F4F7FC" font-size="21" letter-spacing="2">CLOSURE CALENDAR</text><g fill="none" stroke="#AEB9CC" stroke-opacity=".3"><path d="M28 100H412M28 172H412M28 244H412M28 316H412M28 100V350M105 100V350M182 100V350M259 100V350M336 100V350M412 100V350"/></g><rect x="34" y="109" width="290" height="50" rx="10" fill="#6E9BFF"/><text x="51" y="142" fill="#0F1729" font-size="21" font-weight="700">Final new sale</text><rect x="112" y="181" width="290" height="50" rx="10" fill="#3DDC97"/><text x="129" y="214" fill="#0F1729" font-size="21" font-weight="700">Refund work</text><rect x="112" y="253" width="290" height="50" rx="10" fill="#E6C27A"/><text x="129" y="286" fill="#0F1729" font-size="21" font-weight="700">Reserve review</text><text x="28" y="372" fill="#AEB9CC" font-size="14">Illustrative stages, not a release timetable</text></g></svg>
