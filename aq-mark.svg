<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="AQ Pay" overflow="visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AQ Pay</title>
  <style>
    .ring-spin { transform-box: view-box; transform-origin: 31px 30px; }
    .bar { transform-box: fill-box; transform-origin: 50% 50%; }
    .tail { transform-box: view-box; transform-origin: 38.3px 38.7px; }
    .spark, .sheen { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .ring { stroke-dasharray: 100; animation: draw 1s cubic-bezier(.2,.8,.2,1) 80ms both; }
      .a { stroke-dasharray: 100; animation: draw .65s cubic-bezier(.2,.8,.2,1) .42s both; }
      .bar { animation: bar .38s cubic-bezier(.3,1.4,.5,1) .82s both; }
      .tail { animation: swoosh .62s cubic-bezier(.2,1.3,.3,1) .9s both; }
      .ring-spin { animation: spin 12s linear 1.1s infinite; }
      .spark { animation: spark 3.2s ease-out 1.6s infinite; }
      .sheen { animation: sheen 7s ease-in-out 1.45s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes bar { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes swoosh { 0% { opacity: 0; transform: scale(.15) rotate(18deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
    @keyframes spark { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 12% { opacity: 1; } 45%, 100% { opacity: 0; transform: translate(6.5px,.6px) scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sheen { 0% { opacity: 1; transform: translateX(0) skewX(-18deg); } 16%, 100% { opacity: 1; transform: translateX(150px) skewX(-18deg); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131D36"/><stop offset="1" stop-color="#060A14"/></linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E9BFF"/><stop offset=".55" stop-color="#6E9BFF"/><stop offset="1" stop-color="#3DDC97"/></linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="2" y="2" width="60" height="60" rx="16"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect class="sheen" x="-40" y="0" width="40" height="64" fill="url(#sheenGrad)"/></g>
  <g class="ring-spin"><circle class="ring" cx="31" cy="30" r="17" fill="none" stroke="url(#ringGrad)" stroke-width="5.5" stroke-linecap="round" pathLength="100" transform="rotate(-90 31 30)"/></g>
  <path class="a" d="M24.5 38.5 L31 21.5 L37.5 38.5" fill="none" stroke="#F1F5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/>
  <path class="bar" d="M27.4 33 H34.6" stroke="#F1F5FF" stroke-width="3.4" stroke-linecap="round"/>
  <path class="tail" d="M39.4 37.2 Q46.6 44.4 55.4 44.6 A1.55 1.55 0 0 1 55.3 47.7 Q44.9 48.3 37.2 40.2 Z" fill="#3DDC97"/>
  <circle class="spark" cx="56.4" cy="46.1" r="1.7" fill="#3DDC97"/>
</svg>
