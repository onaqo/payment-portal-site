<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 500" role="img" aria-label="Payments flowing from checkouts through the AQ Pay core to several providers; a declined payment is rerouted to a backup acquirer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .lbl{fill:#F4F7FC;font-size:15px;font-weight:600}
    .sub{fill:#AEB9CC;font-size:11.5px;letter-spacing:.08em}
    .pill{fill:#0F1729;stroke:rgba(255,255,255,.14);stroke-width:1.5}
    .wire{fill:none;stroke:rgba(110,155,255,.28);stroke-width:2}
    .wire-out{fill:none;stroke:rgba(61,220,151,.25);stroke-width:2}
    .wire-bad{fill:none;stroke:rgba(255,122,133,.3);stroke-width:2;stroke-dasharray:5 6}
    @media (prefers-reduced-motion: reduce){animateMotion,animate{display:none}}
  </style>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16213A"/><stop offset="1" stop-color="#060A14"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E9BFF"/><stop offset=".55" stop-color="#6E9BFF"/><stop offset="1" stop-color="#3DDC97"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#6E9BFF" stop-opacity=".35"/><stop offset="1" stop-color="#6E9BFF" stop-opacity="0"/></radialGradient>
    <path id="i1" d="M170 120 C 205 120, 200 250, 230 250"/>
    <path id="i2" d="M170 250 L 230 250"/>
    <path id="i3" d="M170 380 C 205 380, 200 250, 230 250"/>
    <path id="o1" d="M370 250 C 397 250, 397 70, 424 70"/>
    <path id="o2" d="M370 250 C 397 250, 397 190, 424 190"/>
    <path id="o3" d="M370 250 C 397 250, 397 310, 424 310"/>
    <path id="o4" d="M370 250 C 397 250, 397 430, 424 430"/>
  </defs>
  <circle cx="300" cy="250" r="150" fill="url(#glow)"/>
  <!-- wires -->
  <use href="#i1" xlink:href="#i1" class="wire"/><use href="#i2" xlink:href="#i2" class="wire"/><use href="#i3" xlink:href="#i3" class="wire"/>
  <use href="#o1" xlink:href="#o1" class="wire-out"/><use href="#o2" xlink:href="#o2" class="wire-out"/><use href="#o3" xlink:href="#o3" class="wire-bad"/><use href="#o4" xlink:href="#o4" class="wire-out"/>
  <!-- sources -->
  <g><rect class="pill" x="10" y="94" width="160" height="52" rx="16"/><circle cx="36" cy="120" r="5" fill="#6E9BFF"/><text class="lbl" x="52" y="125">Web checkout</text></g>
  <g><rect class="pill" x="10" y="224" width="160" height="52" rx="16"/><circle cx="36" cy="250" r="5" fill="#6E9BFF"/><text class="lbl" x="52" y="255">Mobile app</text></g>
  <g><rect class="pill" x="10" y="354" width="160" height="52" rx="16"/><circle cx="36" cy="380" r="5" fill="#6E9BFF"/><text class="lbl" x="52" y="385">Platform API</text></g>
  <!-- providers -->
  <g><rect class="pill" x="424" y="44" width="172" height="52" rx="16"/><text class="lbl" x="446" y="75">PSP A</text><path d="M568 70 l5 5 l10 -11" fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g><rect class="pill" x="424" y="164" width="172" height="52" rx="16"/><text class="lbl" x="446" y="195">Acquirer · EU</text><path d="M568 190 l5 5 l10 -11" fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="236" text-anchor="middle" fill="#E6C27A" font-size="11.5" font-weight="700" letter-spacing=".1em" opacity="0">REROUTED<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.42;.48;.78;.84;1" dur="4.8s" repeatCount="indefinite"/></text></g>
  <g><rect class="pill" x="424" y="284" width="172" height="52" rx="16"/><text class="lbl" x="446" y="315">PSP B</text>
    <g opacity="0"><circle cx="575" cy="310" r="11" fill="rgba(255,122,133,.16)"/><path d="M570 305 l10 10 M580 305 l-10 10" stroke="#FF7A85" stroke-width="3" stroke-linecap="round"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.27;.5;.56;1" dur="4.8s" repeatCount="indefinite"/></g></g>
  <g><rect class="pill" x="424" y="404" width="172" height="52" rx="16"/><text class="lbl" x="446" y="435">Local methods</text><path d="M568 430 l5 5 l10 -11" fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- core -->
  <circle cx="300" cy="250" r="78" fill="none" stroke="#6E9BFF" stroke-width="1.5" opacity="0"><animate attributeName="r" values="74;104" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="230" y="180" width="140" height="140" rx="34" fill="url(#core)" stroke="rgba(110,155,255,.55)" stroke-width="2"/>
  <g transform="translate(266 200) scale(1.06)">
    <circle cx="31" cy="30" r="17" fill="none" stroke="url(#ring)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M24.5 38.5 L31 21.5 L37.5 38.5" fill="none" stroke="#F1F5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27.4 33 H34.6" stroke="#F1F5FF" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M39.4 37.2 Q46.6 44.4 55.4 44.6 A1.55 1.55 0 0 1 55.3 47.7 Q44.9 48.3 37.2 40.2 Z" fill="#3DDC97"/>
  </g>
  <text x="300" y="290" text-anchor="middle" class="lbl" font-size="14">AQ Pay core</text>
  <text x="300" y="306" text-anchor="middle" class="sub" font-size="8.5" letter-spacing=".04em">ROUTING · RISK</text>
  <!-- inbound pulses -->
  <circle r="5" fill="#6E9BFF"><animateMotion dur="2s" repeatCount="indefinite" begin="0s"><mpath href="#i1" xlink:href="#i1"/></animateMotion></circle>
  <circle r="5" fill="#6E9BFF"><animateMotion dur="2s" repeatCount="indefinite" begin=".7s"><mpath href="#i2" xlink:href="#i2"/></animateMotion></circle>
  <circle r="5" fill="#6E9BFF"><animateMotion dur="2s" repeatCount="indefinite" begin="1.35s"><mpath href="#i3" xlink:href="#i3"/></animateMotion></circle>
  <!-- outbound pulses -->
  <circle r="5" fill="#3DDC97"><animateMotion dur="2.4s" repeatCount="indefinite" begin=".3s"><mpath href="#o1" xlink:href="#o1"/></animateMotion></circle>
  <circle r="5" fill="#3DDC97"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.9s"><mpath href="#o4" xlink:href="#o4"/></animateMotion></circle>
  <!-- decline on PSP B, then reroute to Acquirer EU -->
  <circle r="5.5" fill="#E6C27A" opacity="0"><animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;.92;.92" keyTimes="0;.25;1"><mpath href="#o3" xlink:href="#o3"/></animateMotion><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.25;.27;1" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle r="5.5" fill="#E6C27A" opacity="0"><animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.28;.46;1"><mpath href="#o2" xlink:href="#o2"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.27;.28;.46;.48;1" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#3DDC97" opacity="0"><animateMotion dur="4.8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.6;.85;1"><mpath href="#o2" xlink:href="#o2"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.59;.6;.85;.87;1" dur="4.8s" repeatCount="indefinite"/></circle>
</svg>
